# One MCP process; Nginx is the ONLY host-published entry point.
# 8000: MCP transport only. 8001: Cloudflare Access protected admin only.
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    sendfile on;

    upstream lkh_mcp {
        server mcp:8000;
        keepalive 16;
    }

    # Used for both exact MCP routes. Keep headers/streaming intact.
    server {
        listen 8000;
        listen [::]:8000;

        location = /mcp {
            proxy_pass http://lkh_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 2m;
        }

        # Optional trailing slash supported without opening other routes.
        location = /mcp/ {
            proxy_pass http://lkh_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 2m;
        }

        location / {
            return 404;
        }
    }

    # Admin traffic arrives via Cloudflare Tunnel on the Windows host.
    # The backend independently verifies the signed Cloudflare Access JWT.
    server {
        listen 8001;
        listen [::]:8001;

        location = /admin {
            proxy_pass http://lkh_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_cf_visitor;
            proxy_buffering off;
            client_max_body_size 1m;
        }

        location ^~ /admin/ {
            proxy_pass http://lkh_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            client_max_body_size 1m;
        }

        location / {
            return 404;
        }
    }
}
