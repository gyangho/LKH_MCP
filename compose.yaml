name: lkh-mcp
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: lkh-mcp:0.0.1
    restart: unless-stopped
    # No published ports: only gateway and internal Docker services can reach MCP.
    expose:
      - "8000"
    environment:
      MCP_HOST: "0.0.0.0"
    volumes:
      - mcp-data:/app/data
    secrets:
      - mcp_bootstrap
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=32m
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      # Existing Portal upstream: http://192.0.1.22:8000/mcp
      # Bind to Windows host IP (must be assigned to the host).
      - "192.0.1.22:8000:8000"
      # Cloudflare Tunnel on Windows host -> http://127.0.0.1:8001/admin
      - "127.0.0.1:8001:8001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mcp-data:

secrets:
  mcp_bootstrap:
    file: ./secrets/bootstrap.json
