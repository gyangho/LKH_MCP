name: Python & settings verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build admin UI
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.txt
      - name: Syntax
        run: python -m compileall -q server.py src windows_agent tests
      - name: Unit and Windows Agent tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
