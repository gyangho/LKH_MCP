name: Windows native server preview (I1)
on:
  push:
    branches: [refac]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/build-native-server.ps1'
      - 'scripts/generate_icon.py'
      - 'scripts/windows-version.txt'
      - 'frontend/**'
      - 'branding/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-native.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/build-native-server.ps1'
      - 'scripts/generate_icon.py'
      - 'scripts/windows-version.txt'
      - 'frontend/**'
      - 'branding/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-native.yaml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: I1 native configuration unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -t . -p test_native_runtime.py -v
      - name: Build unsigned native preview and check bundled assets
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          ./scripts/build-native-server.ps1 -Python $python
      - name: Smoke-test actual loopback HTTP server
        shell: pwsh
        run: |
          $env:LKH_NATIVE_STATE_DIR = Join-Path $env:RUNNER_TEMP "lkh-mcp-native-smoke"
          $env:MCP_HOST = "127.0.0.1"
          $env:MCP_PORT = "18080"
          $env:LKH_NATIVE_ADMIN_PORT = "18081"
          $exe = Join-Path $PWD "dist/LKH-MCP-Server/LKH-MCP-Server.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "Native server exited before becoming healthy" }
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:18081/admin/healthz" -TimeoutSec 2 -UseBasicParsing
                if ($res.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "Native loopback HTTP healthcheck failed" }
            foreach ($entry in @(
              @{Port=18080; Path="/admin"; Expected=404},
              @{Port=18080; Path="/admin/api/codex/tasks"; Expected=404},
              @{Port=18081; Path="/mcp"; Expected=404},
              @{Port=18081; Path="/administer"; Expected=404}
            )) {
              $uri = "http://127.0.0.1:$($entry.Port)$($entry.Path)"
              $status = 0
              try { $status = (Invoke-WebRequest $uri -UseBasicParsing -TimeoutSec 3).StatusCode }
              catch { $status = [int]$_.Exception.Response.StatusCode }
              if ($status -ne $entry.Expected) { throw "Route leakage $uri got $status" }
            }
            if (-not (Test-Path "$env:LKH_NATIVE_STATE_DIR/data/mcp.sqlite3")) {
              throw "Native staging SQLite was not initialized"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload unsigned preview bundle for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: lkh-mcp-native-preview-unsigned
          path: dist/LKH-MCP-Server/
          if-no-files-found: error
          retention-days: 7
