name: Windows native suite build (I1-I7 staging)
on:
  push:
    branches: [refac]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'scripts/generate_icon.py'
      - 'scripts/windows-version.txt'
      - 'frontend/**'
      - 'branding/**'
      - 'requirements*.txt'
      - 'installer/**'
      - 'windows_agent/**'
      - '.github/workflows/windows-native.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'scripts/generate_icon.py'
      - 'scripts/windows-version.txt'
      - 'frontend/**'
      - 'branding/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-native.yaml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native Windows PowerShell scripts
        shell: pwsh
        run: |
          foreach ($name in @("build-native-server.ps1", "build-native-suite.ps1",
                              "install-agent-task.ps1", "native-installer-preflight.ps1")) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path "scripts/$name").Path
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $name : $($errors[0])"
            }
          }
      - name: I1 native configuration unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pip install -r requirements.txt -r requirements-native-build.txt
          python -m unittest discover -s tests -t . -p 'test_native_*.py' -v
      - name: Build unsigned native preview and check bundled assets
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          ./scripts/build-native-suite.ps1 -Python $python
      - name: Smoke-test actual loopback HTTP server
        shell: pwsh
        run: |
          $env:LKH_NATIVE_STATE_DIR = Join-Path $env:RUNNER_TEMP "lkh-mcp-native-smoke"
          $env:MCP_HOST = "127.0.0.1"
          $env:MCP_PORT = "18080"
          $env:LKH_NATIVE_ADMIN_PORT = "18081"
          $exe = Join-Path $PWD "dist/LKH-MCP-Server/LKH-MCP-Server.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "Native server exited before becoming healthy" }
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:18081/admin/healthz" -TimeoutSec 2 -UseBasicParsing
                if ($res.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "Native loopback HTTP healthcheck failed" }
            foreach ($entry in @(
              @{Port=18080; Path="/admin"; Expected=404},
              @{Port=18080; Path="/admin/api/codex/tasks"; Expected=404},
              @{Port=18081; Path="/mcp"; Expected=404},
              @{Port=18081; Path="/administer"; Expected=404}
            )) {
              $uri = "http://127.0.0.1:$($entry.Port)$($entry.Path)"
              $status = 0
              try { $status = (Invoke-WebRequest $uri -UseBasicParsing -TimeoutSec 3).StatusCode }
              catch { $status = [int]$_.Exception.Response.StatusCode }
              if ($status -ne $entry.Expected) { throw "Route leakage $uri got $status" }
            }
            $trayState = Invoke-WebRequest "http://127.0.0.1:18081/admin/host/tray-state" -TimeoutSec 3 -UseBasicParsing
            if ($trayState.StatusCode -ne 200 -or
                ($trayState.Content | ConvertFrom-Json).state -notin @("unknown", "offline")) {
              throw "Local Agent status must not report unauthenticated Online"
            }
            $leakCode = 0
            try { Invoke-WebRequest "http://127.0.0.1:18080/admin/host/tray-state" -UseBasicParsing -TimeoutSec 3 | Out-Null }
            catch { $leakCode = [int]$_.Exception.Response.StatusCode }
            if ($leakCode -ne 404) { throw "MCP port leaked Agent status endpoint" }
            if (-not (Test-Path "$env:LKH_NATIVE_STATE_DIR/data/mcp.sqlite3")) {
              throw "Native staging SQLite was not initialized"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Windows DPAPI local encryption roundtrip
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "from native_enrollment import _protect, _unprotect; import secrets; raw=secrets.token_bytes(32); assert _unprotect(_protect(raw)) == raw; print('DPAPI_OK')"
      - name: Smoke-test Windows SCM lifecycle on ephemeral runner
        shell: pwsh
        run: |
          $svc = Join-Path $PWD "dist/LKH-MCP-Service/LKH-MCP-Service.exe"
          $enroll = Join-Path $PWD "dist/LKH-MCP-Enroll/LKH-MCP-Enroll.exe"
          $registered = $false
          try {
            ./scripts/native-installer-preflight.ps1 -InstallDir "$PWD"
            & $enroll --provision
            if ($LASTEXITCODE -ne 0) { throw "Device provisioning failed" }
            & $svc --startup auto --username 'NT AUTHORITY\LocalService' install
            if ($LASTEXITCODE -ne 0) { throw "Service registration failed" }
            $registered = $true
            & $svc start
            if ($LASTEXITCODE -ne 0) { throw "Service start failed" }
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:18081/admin/healthz" -TimeoutSec 2 -UseBasicParsing
                if ($res.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Get-Content "$env:ProgramData/LKH-MCP/logs/service-supervisor.log" -Tail 30 -ErrorAction SilentlyContinue
              Get-Content "$env:ProgramData/LKH-MCP/logs/server.log" -Tail 30 -ErrorAction SilentlyContinue
              throw "Windows SCM server did not start"
            }
          } finally {
            if ($registered) {
              & $svc stop
              & $svc remove
            }
          }
      - name: Register fixed Agent and Pig Tray tasks on ephemeral runner
        shell: pwsh
        run: |
          $agentUser = "$env:USERDOMAIN\\$env:USERNAME"
          # Build output layout differs from Installer's final {app} layout.
          $stage = Join-Path $env:RUNNER_TEMP "lkh-task-staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/LKH-Codex-Agent" (Join-Path $stage "agent") -Recurse
          Copy-Item "dist/LKH-MCP-Tray" (Join-Path $stage "LKH-MCP-Tray") -Recurse
          $registered = $false
          try {
            ./scripts/install-agent-task.ps1 -InstallDir $stage -AgentUser $agentUser `
              -ProjectAlias "LKH_MCP" -Repository "gyangho/LKH_MCP" -CheckoutPath "$PWD"
            $cfg = Get-Content "$env:ProgramData/LKH-MCP/config/agent.json" -Raw | ConvertFrom-Json
            if ($cfg.server_url -ne "http://127.0.0.1:18081" -or
                $cfg.agent_id -notlike "win-*" -or
                $cfg.agent_id.Length -ne 16 -or
                $cfg.projects.LKH_MCP.repository -ne "gyangho/LKH_MCP") {
              throw "Installer staging Agent config invalid"
            }
            if ((Get-ScheduledTask -TaskName "LKH-Codex-Agent").State -eq "Disabled") {
              throw "Agent task unexpectedly disabled after initial config"
            }
            $registered = $true
            if (-not (Get-ScheduledTask -TaskName "LKH-Codex-Agent" -ErrorAction Stop)) {
              throw "Agent task not registered"
            }
            if (-not (Get-ScheduledTask -TaskName "LKH-MCP-Tray" -ErrorAction Stop)) {
              throw "Tray logon task not registered"
            }
          } finally {
            foreach ($task in @("LKH-Codex-Agent", "LKH-MCP-Tray")) {
              Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
      - name: Compile preview Installer (no installation)
        shell: pwsh
        run: |
          $compiler = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          & $compiler "installer\\LKH-MCP.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path "dist/installer/LKH-MCP-Setup-UNSIGNED.exe")) {
            throw "Installer file missing"
          }
      - name: Upload unsigned installer (staging only)
        uses: actions/upload-artifact@v4
        with:
          name: lkh-mcp-setup-unsigned-staging
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned preview bundle for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: lkh-mcp-native-server-preview-unsigned
          path: dist/LKH-MCP-Server/
          if-no-files-found: error
          retention-days: 7
